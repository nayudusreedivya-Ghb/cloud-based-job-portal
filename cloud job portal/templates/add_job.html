<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Post Job</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <div class="logo">CloudHire</div>

    <nav>
        <a href="/">Home</a>
        <a href="/jobs">Jobs</a>
    </nav>

</header>

<div class="form-container">

    <h1>Post a New Job</h1>

    <form method="POST">

        <label>Job Title</label>
        <input type="text"
               name="title"
               placeholder="Example: Python Developer"
               required>

        <label>Company Name</label>
        <input type="text"
               name="company"
               placeholder="Company name"
               required>

        <label>Location</label>
        <input type="text"
               name="location"
               placeholder="Chennai"
               required>

        <label>Salary</label>
        <input type="text"
               name="salary"
               placeholder="₹4 - ₹6 LPA"
               required>

        <label>Job Description</label>
        <textarea name="description"
                  placeholder="Enter job description"
                  required></textarea>

        <button type="submit">
            Post Job
        </button>

    </form>

</div>

</body>
</html>
