<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Available Jobs</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>

    <div class="logo">CloudHire</div>

    <nav>
        <a href="/">Home</a>
        <a href="/jobs">Jobs</a>
        <a href="/add-job">Post Job</a>
    </nav>

</header>

<section class="container">

    <h1>Available Jobs</h1>

    <div class="job-container">

        {% for job in jobs %}

        <div class="job-card">

            <h2>{{ job["title"] }}</h2>

            <p>
                <strong>Company:</strong>
                {{ job["company"] }}
            </p>

            <p>
                <strong>Location:</strong>
                {{ job["location"] }}
            </p>

            <p>
                <strong>Salary:</strong>
                {{ job["salary"] }}
            </p>

            <p>{{ job["description"] }}</p>

            <a class="button"
               href="/apply/{{ job['id'] }}">
               Apply Now
            </a>

        </div>

        {% endfor %}

    </div>

</section>

</body>
</html>
